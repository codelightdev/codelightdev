name: Update GitHub Analytics

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: >-
            username=codelightdev
            &show_icons=true
            &include_all_commits=true
            &count_private=true
            &hide_border=true
            &theme=dark
            &title_color=FFD700
            &text_color=F5F5F5
            &icon_color=FFD700
            &bg_color=000000
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate Top Languages
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: >-
            username=codelightdev
            &layout=compact
            &langs_count=8
            &hide_border=true
            &theme=dark
            &title_color=FFD700
            &text_color=F5F5F5
            &icon_color=FFD700
            &bg_color=000000
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          git diff --cached --quiet || git commit -m "Update GitHub analytics cards"

          git push
